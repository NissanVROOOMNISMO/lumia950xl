device-name: 'cityman'
device-vendor: 'Microsoft'
device-model-name: 'Lumia 950 XL'
device-description: 'The Microsoft Lumia 950 XL is a premium Windows 10 Mobile phablet launched in 2015, featuring a 5.7-inch Quad HD (2560x1440) AMOLED display with Corning Gorilla Glass 4 and Glance screen technology. Driven by a Qualcomm Snapdragon 810 octa-core processor and 3GB of LPDDR4 RAM, it delivers high-end performance, further aided by liquid cooling technology. The device is heavily focused on photography, boasting a 20-megapixel PureView rear camera with ZEISS optics, 5th-gen optical image stabilization (OIS), and a triple-LED RGB flash capable of 4K video recording, complemented by a 5MP wide-angle front-facing camera. Key productivity features include Windows Continuum, which allows the phone to power a desktop-like experience via a Display Dock, along with Windows Hello iris recognition for security. Housed in a polycarbonate body with a removable back, it offers 32GB of internal storage (expandable via microSD) and a 3340mAh battery that supports both fast USB-C charging and Qi wireless charging'
